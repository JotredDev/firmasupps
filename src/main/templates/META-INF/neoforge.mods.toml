modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/JotredDev/firmasupps/issues"

[[mixins]]
config="${mod_id}.mixins.json"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    logoFile= "icon.png"
    #credits=""
    authors="${mod_authors}"
    description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.21.1,1.21.2)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId="tfc"
    mandatory = true
    versionRange = "[1.21.1-4.0.9,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId="supplementaries"
    mandatory = true
    versionRange = "[1.21-3.5.1,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId="moonlight"
    mandatory = true
    versionRange = "[1.21-2.27.1,)"
    ordering = "AFTER"
    side = "BOTH"
